services:
  db:
    image: postgres:16-alpine
    container_name: solarmesh-db
    environment:
      POSTGRES_USER: solarmesh
      POSTGRES_PASSWORD: solarmesh_dev_pw
      POSTGRES_DB: solarmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarmesh -d solarmesh"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    container_name: solarmesh-api
    environment:
      SECRET_KEY: dev-secret-change-me-in-production-9f8e7d6c5b4a
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: solarmesh
      POSTGRES_PASSWORD: solarmesh_dev_pw
      POSTGRES_DB: solarmesh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
